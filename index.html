<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رذاذي | RAZAZY - عالم العطور الفاخرة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0b0b;
            --card-bg: #151515;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #b0b0b0;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.8;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 45px 20px 30px;
            background: radial-gradient(circle at top, #201b12 0%, #0b0b0b 75%);
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo-ar {
            font-size: 3.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-main);
            line-height: 1.1;
        }

        .brand-logo-en {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            letter-spacing: 7px;
            color: var(--gold);
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .hero-video-container {
            max-width: 300px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.35);
            background: #000;
        }

        .hero-video-container video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .specs-badge {
            display: inline-flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 8px 22px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-bottom: 18px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .brand-story {
            color: var(--gold-light);
            font-size: 1.02rem;
            max-width: 600px;
            margin: 15px auto 0;
            line-height: 1.85;
            font-weight: 400;
            padding: 0 15px;
            border-right: 3px solid var(--gold);
            text-align: right;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 35px 20px 60px;
        }

        .search-box {
            margin-bottom: 35px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 15px 22px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .perfumes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 25px;
        }

        .perfume-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .perfume-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .perfume-number {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.8rem;
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 700;
            z-index: 2;
        }

        .perfume-img-container {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 18px;
            background: #0a0a0a;
            border: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .perfume-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .perfume-card:hover .perfume-img-container img {
            transform: scale(1.05);
        }

        .perfume-title-ar {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .perfume-title-en {
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            color: var(--gold);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .perfume-desc {
            font-size: 0.92rem;
            color: #cccccc;
            margin-bottom: 20px;
            text-align: justify;
        }

        .perfume-details {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-bottom: 20px;
            font-size: 0.88rem;
        }

        .detail-row {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .detail-value {
            color: var(--text-muted);
        }

        .price-tag {
            color: var(--gold-light);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #d4af37 0%, #aa8520 100%);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 12px;
            font-size: 0.98rem;
            transition: opacity 0.3s, transform 0.2s;
        }

        .btn-whatsapp:hover {
            opacity: 0.92;
            transform: scale(1.01);
        }

        footer {
            text-align: center;
            padding: 35px 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.88rem;
            background: #080808;
        }

        footer span {
            color: var(--gold);
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .brand-logo-ar { font-size: 2.7rem; }
            .perfumes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-logo-ar">رذاذي</div>
        <div class="brand-logo-en">RAZAZY</div>
        
        <div class="hero-video-container">
            <video autoplay muted loop playsinline>
                <source src="perfume.mp4" type="video/mp4">
                متصفحك لا يدعم تشغيل الفيديو
            </video>
        </div>

        <div class="specs-badge">
            <span>EAU DE PARFUM</span>
            <span>•</span>
            <span>50 ML / 1.7 FL.OZ</span>
            <span>•</span>
            <span>MADE IN KSA 🇸🇦</span>
        </div>

        <p class="brand-story">
            "انطلقنا لنقدم تجربة عطرية فريدة تمزج أصالة الشرق بروعة الفخامة العصرية، لتعبر كل رشة عن هويتك الخاصة"
        </p>
    </header>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث باسم العطر أو الطابع العطري (مثل: مسك، خشبي، منعش، رسمي)...">
        </div>

        <div class="perfumes-grid" id="perfumesList"></div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة لبراند <span>رذاذي | RAZAZY</span></p>
        <p style="margin-top: 5px; font-size: 0.78rem;">صُنع بفخر في المملكة العربية السعودية</p>
    </footer>

    <script>
        const WHATSAPP_NUMBER = "966539266125";
        
        // ربط صورة العطر الحقيقية التي سميتها bottle.jpg
        const PERFUME_IMAGE_URL = "bottle.jpg";

        const perfumes = [
            { id: 1, nameAr: 'رذاذي - فخامة', nameEn: 'Razazy - Luxury', desc: 'توليفة عطرية صُممت لتعبر عن الرقي الكلاسيكي والحضور المهيب. يجمع هذا العطر بين الانتعاش الأنيق والعمق الدافئ ليكون رفيقك المثالي في المناسبات الرسمية والاجتماعات الهامة. عطر متوازن يمنحك هالة من الثقة والوقار منذ اللحظة الأولى.', character: 'أروماتك - خشبي فاخر.', usage: 'مثالي للمناسبات الرسمية، المساء، والأجواء المعتدلة.', price: '35 ريال سعودي' },
            { id: 2, nameAr: 'رذاذي - تميز', nameEn: 'Razazy - Signature', desc: 'عطر استثنائي صُنع لمن يرفضون أن يكونوا عاديين. يتميز بتركيبة متناغمة تجمع بين الحيوية العصرية والجاذبية الدافئة، مما يجعله عطراً يأسر الحواس ويصعب نسيانه. بضع رشات كفيلة بأن تجعله خيارك الأول الذي لا غنى عنه في كل يوم.', character: 'حمضي - أروماتك دافئ.', usage: 'مناسب للاستخدام اليومي، العمل، واللقاءات الخاصة.', price: '35 ريال سعودي' },
            { id: 3, nameAr: 'رذاذي - انتعاش', nameEn: 'Razazy - Fresh Breeze', desc: 'جرعة نقية من الحيوية والانطلاق في زجاجة واحدة. يستلهم هذا العطر نسمات الصباح المنعشة ليمنحك شعوراً فورياً بالنظافة والتجدد طوال ساعات النهار. خيار مثالي للأجواء الحارة ومحبي الروائح الخفيفة والمنعشة التي تبث الطاقة الإيجابية.', character: 'منعش - حمضي عشبي.', usage: 'مثالي لأوقات الصباح، الصيف، النادي الرياضي، والدوام اليومي.', price: '35 ريال سعودي' },
            { id: 4, nameAr: 'رذاذي - نيتش', nameEn: 'Razazy - Niche Velvet', desc: 'تجربة عطرية مخملية مستوحاة من عالم عطور النيش الحصرية. يمتاز بتدرج عطري ساحر يبدأ بنفحات غامضة وجذابة، ثم يستقر على لمسة ناعمة ودافئة تلامس الحواس برقي وهدوء. عطر يعكس الذوق الرفيع والخصوصية التامة لمن يرتديه.', character: 'زهري - شرقي مخملي.', usage: 'مثالي للأمسيات الخاصة، السهرات، والأجواء الباردة.', price: '35 ريال سعودي' },
            { id: 5, nameAr: 'رذاذي - بصمة خاصة', nameEn: 'Razazy - Special Scent', desc: 'اجعل لحضورك بصمة خاصة تسبقك إلى أي مكان. يجمع هذا العطر ببراعة بين الانتعاش الراقي واللمسات الحسية الدافئة، ليخلق تناغماً فريداً يندمج مع شخصيتك ويترك أثراً عالقاً في الأذهان حتى بعد رحيلك.', character: 'خشبي - زهري متوازن.', usage: 'متعدد الاستخدامات، يناسب كافة الأوقات والفصول.', price: '35 ريال سعودي' },
            { id: 6, nameAr: 'رذاذي - الجاذبية', nameEn: 'Razazy - Magnetic Attraction', desc: 'قوة جذب لا تُقاوم في كل رشة. عطر جريء ومكثف صُمم ليبرز الكاريزما الشخصية بأسلوب عصري لافت. يرتكز على نفحات عميقة ومثيرة تمنحك فوحاناً قوياً وثباتاً يدوم لساعات طويلة، ليكون سر جاذبيتك في كل لقاء.', character: 'شرقي - تابلي دافئ.', usage: 'مثالي للسهرات، المناسبات المسائية، وأجواء الشتاء.', price: '35 ريال سعودي' },
            { id: 7, nameAr: 'رذاذي - ملكي', nameEn: 'Razazy - Royal', desc: 'فخامة تليق بالملوك. توليفة غنية ومهيبة تمزج بين عراقة النفحات الشرقية الساحرة ولمسات العطور الغربية الفاخرة، لتنتج عطراً ذا شخصية قوية وحضور طاغٍ. صُمم ليمنحك شعوراً بالتميز المطلق في أرقى المحافل والمناسبات.', character: 'شرقي - فانيليا وأخشاب فاخرة.', usage: 'مثالي للأعياد، حفلات الزفاف، والمناسبات الكبرى.', price: '35 ريال سعودي' },
            { id: 8, nameAr: 'رذاذي - الانتعاش القوي', nameEn: 'Razazy - Power Fresh', desc: 'عندما يلتقي الانتعاش الفائق بقوة الثبات. يتميز هذا العطر بتركيبة معززة بنفحات المسك الأبيض النقي مع لمسات حمضية حادة، ليمنحك إحساساً بالنظافة الفاخرة والفوحان القوي الذي يصمد أمام حرارة الأجواء لساعات طويلة.', character: 'مسكي - حمضي منعش.', usage: 'مثالي للأجواء الحارة، الاستخدام اليومي المكثف، وبعد الاستحمام.', price: '35 ريال سعودي' },
            { id: 9, nameAr: 'رذاذي - الفخامة الهادئة', nameEn: 'Razazy - Calm Luxury', desc: 'الأناقة الحقيقية لا تحتاج إلى صخب. عطر ناعم ومريح للأعصاب يجمع بين نقاء المسك الفاخر ولمسات دافئة وهادئة تمنحك إحساساً بالسكينة والرقي. مثالي لمن يفضلون العطور الراقية التي تمنح حضوراً أنيقاً دون حدة.', character: 'مسكي - بودري ناعم.', usage: 'مثالي لأوقات الاسترخاء، العمل المكتبي، واللقاءات العائلية.', price: '35 ريال سعودي' },
            { id: 10, nameAr: 'رذاذي - رومانسية', nameEn: 'Razazy - Romantic', desc: 'ترجمة عطرية للمشاعر الدافئة واللحظات الحالمة. ينسج هذا العطر هالة من الرقة والنعومة بفضل التناغم الساحر بين النفحات الزهرية الحالمة ولمسات المسك الناعم، ليمنحك جاذبية آسرة تفيض بالأنوثة والرقي.', character: 'زهري - مسكي حالم.', usage: 'مثالي للأمسيات الرومانسية، الهدايا، والأوقات الخاصة.', price: '35 ريال سعودي' },
            { id: 11, nameAr: 'رذاذي - نغم الفخامة القوية', nameEn: 'Razazy - Naghram Luxury', desc: 'سيمفونية عطرية جريئة لعشاق العطور الثقيلة ذات الفوحان الاستثنائي. يجمع بين عمق الأخشاب العطرية وقوة المسك المركز ليخلق رائحة فخمة ومشبعة تفرض حضورها بقوة وتدوم على الملابس لأيام.', character: 'خشبي - مسكي مركز.', usage: 'مثالي للأجواء الباردة، المناسبات المسائية الفاخرة، ومحبي العطور القوية.', price: '35 ريال سعودي' }
        ];

        const container = document.getElementById('perfumesList');
        const searchInput = document.getElementById('searchInput');

        function renderPerfumes(list) {
            container.innerHTML = '';
            list.forEach(p => {
                const message = encodeURIComponent(`مرحباً براند رذاذي، أرغب في طلب عطر: (${p.nameAr} - ${p.nameEn}) بسعر ${p.price}، حجم 50 مل.`);
                const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                const card = document.createElement('div');
                card.className = 'perfume-card';
                card.innerHTML = `
                    <span class="perfume-number">#${p.id}</span>
                    <div>
                        <div class="perfume-img-container">
                            <img src="${PERFUME_IMAGE_URL}" alt="${p.nameAr}">
                        </div>
                        <h2 class="perfume-title-ar">${p.nameAr}</h2>
                        <div class="perfume-title-en">${p.nameEn}</div>
                        <p class="perfume-desc">${p.desc}</p>
                    </div>
                    <div>
                        <div class="perfume-details">
                            <div class="detail-row">
                                <span class="detail-label">الطابع العطري:</span>
                                <span class="detail-value">${p.character}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">أوقات الاستخدام:</span>
                                <span class="detail-value">${p.usage}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">الحجم والتركيز:</span>
                                <span class="detail-value">50 مل — Eau de Parfum</span>
                            </div>
                            <div class="detail-row" style="margin-bottom:0;">
                                <span class="detail-label">السعر للعبوة:</span>
                                <span class="detail-value price-tag">${p.price}</span>
                            </div>
                        </div>
                        <a href="${waLink}" target="_blank" class="btn-whatsapp">
                            <span>اطلب العطر عبر واتساب</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = perfumes.filter(p => 
                p.nameAr.toLowerCase().includes(term) || 
                p.nameEn.toLowerCase().includes(term) || 
                p.character.toLowerCase().includes(term) ||
                p.usage.toLowerCase().includes(term)
            );
            renderPerfumes(filtered);
        });

        renderPerfumes(perfumes);
    </script>
</body>
</html>
